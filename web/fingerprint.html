<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser / JS Fingerprint Probe</title>
<style>
  :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { max-width: 760px; margin: 2rem auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 1.25rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  td { border-bottom: 1px solid #8884; padding: .4rem .5rem; vertical-align: top; }
  td:first-child { white-space: nowrap; color: #888; }
  .flag { color: #c0392b; font-weight: 700; }
  .ok { color: #27ae60; }
  #verdict { margin-top: 1.5rem; padding: .75rem 1rem; border: 1px solid #8884; border-radius: 6px; }
</style>
</head>
<body>
<h1>Browser / JS fingerprint probe</h1>
<p>Client-side signals an anti-bot script reads from the JS runtime. Open this
page in a normal browser vs. a headless/automated one and compare. A real
browser trips none of the flags; naive automation trips several.</p>
<table id="out"></table>
<div id="verdict"></div>
<script>
(function () {
  const rows = [];
  let flags = 0;

  function add(label, value, isFlag) {
    rows.push({ label, value: String(value), isFlag: !!isFlag });
    if (isFlag) flags++;
  }

  // 1. The classic automation tell.
  add("navigator.webdriver", navigator.webdriver, navigator.webdriver === true);

  // 2. Headless Chrome historically had 0 plugins and empty languages.
  add("navigator.plugins.length", navigator.plugins.length, navigator.plugins.length === 0);
  add("navigator.languages", JSON.stringify(navigator.languages),
      !navigator.languages || navigator.languages.length === 0);

  // 3. Hardware signals that are often default/odd under automation.
  add("hardwareConcurrency", navigator.hardwareConcurrency,
      !navigator.hardwareConcurrency);
  add("deviceMemory", navigator.deviceMemory ?? "undefined", false);

  // 4. window.chrome presence (absent in some headless configs).
  add("window.chrome present", !!window.chrome, !window.chrome);

  // 5. WebGL vendor/renderer — "SwiftShader"/"llvmpipe" betrays software GL.
  let glRenderer = "n/a";
  try {
    const gl = document.createElement("canvas").getContext("webgl");
    const dbg = gl && gl.getExtension("WEBGL_debug_renderer_info");
    if (dbg) glRenderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
  } catch (e) {}
  add("WebGL renderer", glRenderer,
      /swiftshader|llvmpipe|software/i.test(glRenderer));

  // 6. Canvas fingerprint — stable per device/driver; here we just hash it.
  let canvasHash = "n/a";
  try {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px Arial";
    ctx.fillStyle = "#069";
    ctx.fillText("anti-bot-lab \u{1F916}", 2, 2);
    const data = c.toDataURL();
    let h = 0;
    for (let i = 0; i < data.length; i++) { h = (h * 31 + data.charCodeAt(i)) | 0; }
    canvasHash = (h >>> 0).toString(16);
  } catch (e) {}
  add("canvas hash", canvasHash, false);

  // 7. Permissions API inconsistency (notification default under automation).
  add("userAgent", navigator.userAgent, false);

  const out = document.getElementById("out");
  out.innerHTML = rows.map(r =>
    `<tr><td>${r.label}</td><td class="${r.isFlag ? 'flag' : 'ok'}">${r.value}</td></tr>`
  ).join("");

  const v = document.getElementById("verdict");
  if (flags === 0) {
    v.innerHTML = "<b class='ok'>Looks like a real browser</b> — 0 automation flags.";
  } else {
    v.innerHTML = `<b class='flag'>Automation suspected</b> — ${flags} flag(s) tripped. ` +
      "A stealth-patched browser (see clients/browser_playwright.py) clears these.";
  }
})();
</script>
</body>
</html>
